spring:
  application:
    name: shopflow_coupon

  datasource:
    url: jdbc:mysql://localhost:3307/shopflow_order?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: false

server:
  port: 8084

jwt:
  secret: shopflow-secret-key-must-be-at-least-256-bits-long
  expiration: 3600000


logging:
  level:
    com.ecommerce.user: DEBUG
    org.hibernate.SQL: DEBUG