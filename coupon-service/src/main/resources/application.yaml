spring:
  application:
    name: shopflow_coupon

  datasource:
    url: jdbc:mysql://localhost:3307/shopflow_coupon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: coupon-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085

jwt:
  secret: shopflow-secret-key-must-be-at-least-256-bits-long
  expiration: 3600000


logging:
  level:
    com.ecommerce.user: DEBUG
    org.hibernate.SQL: DEBUG