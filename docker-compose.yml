version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shopflow-msa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - shopflow-msa-mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  shopflow-msa-mysql-data: